    <!-- Suppress Vite WebSocket/HMR disconnect errors in AI Studio iframe environment -->
    <script>
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes("reading 'send'") || event.message.includes('WebSocket') || event.message.includes('vite'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes("reading 'send'") || String(event.reason).includes('WebSocket'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
